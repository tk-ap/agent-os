$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "urn:agent-os:contract:workflow:v0"
title: Agent OS Workflow Contract v0
summary: Declarative sequence for a task class. This contract contains no executable commands.
type: object
additionalProperties: false
required: [api_version, kind, metadata, spec]
properties:
  api_version:
    const: agent-os/v0alpha1
  kind:
    const: Workflow
  metadata:
    type: object
    additionalProperties: false
    required: [id]
    properties:
      id:
        type: string
        minLength: 1
  spec:
    type: object
    additionalProperties: false
    required: [task_types, stages]
    properties:
      task_types:
        type: array
        minItems: 1
        items: {type: string}
        uniqueItems: true
      stages:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [id, intent, gate]
          properties:
            id:
              type: string
              minLength: 1
            intent:
              type: string
              minLength: 1
            gate:
              type: string
              enum: [none, authorization, human-approval]
            required_evidence:
              type: array
              items: {type: string}
              uniqueItems: true
              default: []
      completion:
        type: object
        additionalProperties: false
        properties:
          required_states:
            type: array
            items:
              type: string
              enum: [attempted, implemented, previewed, verified, deployed, user-validated]
            uniqueItems: true
          unresolved_gates_allowed:
            type: boolean
            default: true
