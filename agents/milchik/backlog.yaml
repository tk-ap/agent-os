# Milchik-managed work backlog — machine-readable data.
#
# Ranked by runtime/backlog.py (attention_score + authority_present). Origin is
# declared per item and weighted there, not here. This file holds *proposal*
# state; a human-triggered item is pre-authorized to queue by its source, while
# agent/routine items still require explicit approval before enqueue.
#
# Status: proposed -> approved -> queued (fleet) -> done. Ranking decides
# attention; approval decides execution.
#
# `done` is terminal and carries evidence. runtime/backlog.py deliberately
# scores on priority and confidence alone, so a done item still ranks — it is
# consumers that must exclude it (see backlog_top in the Telegram surface).
# Completed items stay here as history rather than being deleted.
#
# Lane is a soft gate (runtime/backlog.py LANE_BONUS). `ecosystem` is backend
# work on the operating layer itself and drains first; `directive` is product
# work. Ecosystem carries +30, so any ecosystem item at p1 or above outranks any
# directive, while a p0 directive still breaks through ahead of ecosystem p2/p3
# rather than starving behind cleanup. Lane defaults to `ecosystem` when absent.
#
# ailhat directives enter here as ordinary entries with `source: ailhat` and
# `lane: directive`, carrying a `source_ref` back to the live ailhat record so
# the entry can be re-read rather than becoming a stale copy:
#
#   - work_id: <id>
#     source: ailhat
#     lane: directive
#     status: proposed          # ailhat proposes; it does not authorize
#     source_ref: {system: ailhat, id: <ailhat record id>, ref: <path or url>}
#
# ailhat is intelligence, not authority: authority_present is false for it, so
# a directive is only eligible once it is explicitly `approved`. No ailhat
# source is wired up yet — the shape is defined, the intake is not built.

