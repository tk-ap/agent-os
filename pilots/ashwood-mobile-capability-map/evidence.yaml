  changes:
    - first pass attempted to hide only the capability map mounted as a direct child of principles-field
    - user validation falsified that assumption: blank gap and blurred inactive map remained
    - second pass removed inactive mobile capability-map layout/compositing and reduced hotspot density
    - second human validation showed meaningful improvement but exposed active-map geometry and missing mobile Doctor Bird
    - third pass allowed the active map to grow beyond 100dvh and made Doctor Bird visible as a static touch companion
    - user design review then rejected the mobile hotspot hunt itself as unnecessary interaction overhead and rejected the static bird treatment as insufficiently bird-like
    - fourth pass retired the hotspot offering on mobile and attempted a native capability chapter plus animated SVG Doctor Bird
    - fourth human validation found two regressions: the capability chapter was absent and the replacement vector materially degraded the established Doctor Bird imagery
    - fifth pass makes the mobile capability chapter self-contained from the six canonical capability definitions so it no longer depends on the desktop curiosity runtime constructing the DOM
    - fifth pass restores the exact prior rendered Doctor Bird asset as a Git blob rather than recreating it
    - fifth pass adds a separate mobile motion controller that preserves the rendered asset, adds hover/body movement and rendered-image wing-motion traces, and moves Doc between guide waypoints
