version: 0.1.0
adapter: hermes
harness_class: operator-harness

canonical_sources:
  product_routing: registry/product-routing.yaml
  agent_routing: registry/agents.yaml
  harness_routing: registry/harnesses.yaml
  skills: registry/skills.yaml
  handoffs: policies/HANDOFF_POLICY.md

repositories:
  product:
    role: working-tree
    required_access: read-write
    may_modify: true
    authority: product-specific-source-of-truth
  agent_os:
    role: operating-layer
    preferred_access: read-only
    may_modify: false
    authority: workforce-policy-product-routing-and-capability

precedence:
  - platform-and-system-rules
  - product-repository-instructions
  - agent-os-product-routing
  - agent-os-policies
  - selected-agent-identity
  - selected-approved-skills
  - task-specific-instructions

harness:
  mode: local
  orchestrates: [codex-cli, claude-code, opencode]
  selection_authority: advisory-only
  delegation_inside_task_envelope: true
  authority_boundary: policy-controlled

execution:
  team_mode: minimum-sufficient
  single_runner_supported: true
  load_all_agents: false
  load_all_skills: false
  require_product_boundary_check: true
  require_verification: true
  return_outcome_evidence_when_material: true
  default_delivery: product-repository-change
  pr_review_delivery: github-comment

portable_contracts:
  work_item: contracts/work-item.schema.json
  capability_manifest: contracts/capability-manifest.schema.json
  context_envelope: contracts/context-envelope.schema.json
  authorization_request: contracts/authorization-request.schema.json
  outcome_event: contracts/outcome-event.schema.json

ownership:
  context_intelligence: alvira-meos
  authorization_intelligence: agent-control
  shared_workforce_execution: agent-os-workforce
  portfolio_intelligence: ailhat
  governance_enforcement_when_relevant: ledgato

cross_product_write_policy:
  default: propose-handoff
  direct_write_requires: explicit-task-authorization
  preserve_destination_repo_instructions: true

agent_os_write_policy:
  default: deny
  allow_when:
    - task-explicitly-targets-agent-os
    - user-explicitly-authorizes-agent-os-change

skill_policy:
  allowed_trust_levels:
    - owned
    - approved
  candidate_execution: false
  prefer_vendored: true
  external_discovery: resolver-governed

security:
  browser_execution: fail-closed
  browser_attestation_schema: contracts/browser-runtime-attestation.schema.json
  browser_security_module: runtime/browser_security.py
  harness_attestation_required_for: [browser]

escalation:
  policy: policies/AUTONOMY_POLICY.md
  do_not_escalate_for_uncertainty_alone: true
