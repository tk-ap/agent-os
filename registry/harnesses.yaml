version: 0.1.0
status: v0alpha1
mode: declarative-non-executable

# This registry is data. The executable local-file binding lives in the adapter.
execution_bindings:
  hermes-fleet:
    adapter: adapters/hermes/fleet
    entrypoint: adapters/hermes/fleet_cli.py
    dispatcher: hermes_cli.kanban_db_dispatch.dispatch_once
    trigger: hermes-cron-no-agent
    harnesses: [codex-cli, claude-code, gemini-cli]
    scope: local-file-work
    verification: review-required-after-cli-exit
    unavailable: [opencode]

# Named harness registry.
#
# Each entry describes an agentic executor as an instance of
# contracts/v0/harness.schema.yaml. This registry adds the operational
# relationships (orchestration, delegation, selection hints) that the schema
# intentionally leaves out. It grants no authority and stores no secrets.

principles:
  harness_is_executor_not_agent: >
    A harness is the model/tool environment that performs agentic execution.
    A durable organizational agent (Eugene, Designer, Rook, ...) executes
    through a harness but is never identical to it. Agent identity is
    distinct from harness/provider identity.
  harness_never_grants_authority: >
    Harness capability, mode, provider, or tool access can never widen task
    authorization. authority_boundary is fixed at policy-controlled.
  selection_may_consider_but_not_expand: >
    Harness selection may weigh task class, tools, cost, privacy, model
    capability, and environment compatibility. None of these factors expand
    authority or bypass a human gate.
  delegation_stays_inside_task_envelope: >
    A harness that delegates execution to a sub-harness stays inside the same
    task envelope, authorization state, and policy boundary. Delegation
    creates no new authority and no new product ownership.

# Browser E2E is a required verification capability. The priority identifies
# the harness to finish first; it does not bypass the fail-closed attestation
# bridge or authorize browser execution by itself.
browser_e2e:
  priority_harness: hermes
  status: priority-attestation-work
  coverage:
    - route-and-navigation-smoke
    - critical-user-paths
    - interaction-and-state-transitions
    - responsive-desktop-mobile-layouts
    - keyboard-and-accessibility-basics
    - visual-screenshot-review
    - console-and-network-errors
    - failure-denial-and-recovery-paths
    - evidence-capture-and-task-attachment
  required_evidence:
    - rendered-route-checks
    - critical-user-path
    - failure-or-denial-path
    - console-and-network-review
    - responsive-or-mobile-check-when-relevant
  policy_boundary: browser-execution-requires-host-verified-attestation

harnesses:
  hermes:
    id: hermes
    provider: nous-research
    role: operator-harness
    orchestrates: [codex-cli, claude-code, gemini-cli, opencode]
    mode: local
    capabilities: [filesystem, git, shell, browser, network, mcp, local-models]
    compatible_hosts: [omarchy]
    credential_classes: [provider-api, scm]
    constraints:
      - single-runner-sequential-multi-agent
      - human-merge-gated
      - delegation-stays-inside-task-envelope
    selection_hints:
      - primary-harness-for-browser-e2e-when-host-attestation-is-available
      - prefer-codex-for-heavy-implementation-and-pr-work
      - prefer-claude-code-for-feature-work-and-review
      - prefer-opencode-for-bounded-pr-review
      - prefer-local-models-when-context-forbids-remote-eval
    authority_boundary: policy-controlled

  codex-cli:
    id: codex-cli
    provider: openai
    role: sub-harness
    mode: remote
    capabilities: [filesystem, git, shell]
    credential_classes: [provider-api]
    constraints:
      - browser-execution-requires-runtime-attestation
    authority_boundary: policy-controlled

  claude-code:
    id: claude-code
    provider: anthropic
    role: sub-harness
    mode: remote
    capabilities: [filesystem, git]
    credential_classes: [provider-api]
    authority_boundary: policy-controlled

  # Independent capacity. Codex and Claude are the only executors today, so a
  # single exhausted provider stops the fleet outright; Gemini answers to a
  # different account and quota pool entirely. Declared filesystem-only on
  # purpose: approval_mode auto_edit auto-approves edit tools and nothing else,
  # so a shell or git call would need a confirmation headless execution cannot
  # give. Capability routing therefore never hands it work it could not finish.
  gemini-cli:
    id: gemini-cli
    provider: google
    role: sub-harness
    mode: remote
    capabilities: [filesystem]
    credential_classes: [provider-api]
    constraints:
      - approval-mode-auto-edit-never-yolo
      - workspace-must-be-trusted-or-approvals-silently-downgrade
      - no-shell-or-git-until-the-registry-says-otherwise
    authority_boundary: policy-controlled

  opencode:
    id: opencode
    provider: sst
    role: sub-harness
    mode: remote
    capabilities: [filesystem, git, shell]
    credential_classes: [provider-api]
    authority_boundary: policy-controlled
