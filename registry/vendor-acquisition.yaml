version: 0.3.0
status: plan-only
activation_rule: Candidates remain non-executable until reviewed, adapted, validated, and explicitly marked approved in registry/skills.yaml.

sources:
  agentic-awesome-skills:
    repository: sickn33/agentic-awesome-skills
    pinned_commit: d91ed427d91596da3fcab6dd26ff3306c8003ce5
    release_observed: v16.4.0
    license: verify per candidate and upstream source before acquisition
  vercel-agent-skills:
    repository: vercel-labs/agent-skills
    pinned_commit: 063bee94c3f4df8453406c830b0a7df0f2860278
    license: verify from repository and skill before acquisition
  agentmail-skills:
    repository: agentmail-to/agentmail-skills
    pinned_commit: e0db938ca1dfd9f7525e08c0264c019707e034e2
    install_command: npx skills add agentmail-to/agentmail-skills
    role: first-party portable vendor source; select individual skills rather than installing AgentMail as an agent identity
    license: unresolved; no repository license file or searchable license declaration observed in the pinned snapshot, so verify before approval or vendoring
  user-supplied-agent-skills-suite-2026-09-01:
    source_type: local-user-supplied-package
    review: registry/source-reviews/agent-skills-suite-2026-09-01.md
    artifacts: [Agent Routine Builder Skill-20260901T213926Z-1-001.zip, Agent Persona SKILL-20260901T213924Z-1-001.zip, Agent Org Chart SKILL-20260901T213921Z-1-001.zip, AI Agent INSTRUCTIONS.md]
    role: reviewed reference material only; selected concepts may inform owned Agent OS skills and policy
    license: unresolved
    executable: false
    install_allowed: false

candidates:
  - id: frontend-design
    source: agentic-awesome-skills
    path: skills/frontend-design/SKILL.md
    intended_scope: product-local public interface and ASHWOOD editorial design
    proposed_agents: [designer, eugene]
    risk: critical; requires instruction-safety and anti-overreach adaptation
    priority: p1
  - id: browser-testing-with-devtools
    source: agentic-awesome-skills
    path: skills/browser-testing-with-devtools/SKILL.md
    intended_scope: rendered browser, console, network, responsive, accessibility, and performance verification
    proposed_agents: [eugene, w-dog, designer]
    risk: critical; tool and permission assumptions require adaptation
    priority: p0
  - id: accessibility-audit
    source: agentic-awesome-skills
    path: skills/accessibility-compliance-accessibility-audit/SKILL.md
    intended_scope: public product and portfolio accessibility review
    proposed_agents: [designer, eugene, w-dog]
    risk: review dependencies and compliance claims
    priority: p1
  - id: security-hardening
    source: agentic-awesome-skills
    path: skills/security-scanning-security-hardening/SKILL.md
    intended_scope: authorized application and agent boundary hardening
    proposed_agents: [rook, eugene, w-dog]
    risk: critical; must remove unsupported subagent, tooling, compliance, and autonomous-remediation assumptions
    priority: p0
  - id: agent-memory-systems
    source: agentic-awesome-skills
    path: skills/agent-memory-systems/SKILL.md
    intended_scope: ALVIRA/MeOS and workforce memory architecture
    proposed_agents: [eugene, w-dog, rook]
    risk: validate privacy, retention, vendor, and cost assumptions
    priority: p1
  - id: react-best-practices
    source: vercel-agent-skills
    path: skills/react-best-practices/SKILL.md
    intended_scope: React product repositories only
    proposed_agents: [eugene, designer]
    risk: framework-specific; do not load for non-React repositories
    priority: p1
  - id: web-design-guidelines
    source: vercel-agent-skills
    path: skills/web-design-guidelines/SKILL.md
    intended_scope: review of web interfaces after implementation
    proposed_agents: [designer, w-dog]
    risk: review upstream tool assumptions and avoid overriding product art direction
    priority: p1
  - id: vercel-optimize
    source: vercel-agent-skills
    path: skills/vercel-optimize/SKILL.md
    intended_scope: Vercel adapter only; deployment cost, performance, and runtime investigation
    proposed_agents: [eugene, ledger, w-dog]
    risk: broad skill with scripts and live-account assumptions; acquire only after adapter and dependency review
    priority: p2

  # User-supplied suite is reference-only. It may inform owned capability design but
  # must not be copied into skills/vendor or executed until provenance/license/layout
  # issues are resolved and a separate approval is recorded.
  - id: agent-routine-builder-reference
    source: user-supplied-agent-skills-suite-2026-09-01
    artifact: Agent Routine Builder Skill-20260901T213926Z-1-001.zip
    intended_scope: design input for recurring-work contracts, failure guardrails, scheduling abstraction, validation, and cost controls
    proposed_agents: [bill, rook, ledger, w-dog, router]
    disposition: adapted-into-owned-recurring-work
    trust: candidate
    executable: false
    license: unresolved
    risk: package reference paths do not match supplied flat layout; quantitative/anecdotal claims require primary-source verification; platform-specific examples must not become core runtime assumptions
    priority: p0
  - id: agent-persona-builder-reference
    source: user-supplied-agent-skills-suite-2026-09-01
    artifact: Agent Persona SKILL-20260901T213924Z-1-001.zip
    intended_scope: design input for persistent identity contracts, boundaries, continuity, handoffs, error correction, and first-task validation
    proposed_agents: [router, steward, w-dog, rook]
    disposition: adapted-into-owned-agent-identity-design
    trust: candidate
    executable: false
    license: unresolved
    risk: orchestrator-specific persona, memory, and heartbeat assumptions; package reference paths do not match supplied flat layout; must not dynamically proliferate Agent OS identities
    priority: p1
  - id: agent-org-planner-reference
    source: user-supplied-agent-skills-suite-2026-09-01
    artifact: Agent Org Chart SKILL-20260901T213921Z-1-001.zip
    intended_scope: design input for agents-vs-skills decisions, minimum-sufficient-team routing, producer-inspector loops, handoffs, and bounded review termination
    proposed_agents: [router, bill, w-dog, rook, steward]
    disposition: adapted-into-router-and-handoff-policy
    trust: candidate
    executable: false
    license: unresolved
    risk: generic org generation conflicts with established Agent OS ownership if treated as authority; numeric coordination/review claims require independent verification; package reference paths do not match supplied flat layout
    priority: p1

  # AgentMail capability supply. These are deliberately selective: mail is a
  # reusable workforce capability, not a standalone Agent OS agent.
  - id: agent-email-patterns
    source: agentmail-skills
    path: agent-email-patterns/SKILL.md
    pinned_blob: 479909f3875732e193602c49d8c0e9405d18ba12
    intended_scope: dedicated agent inbox architecture, human-in-the-loop email, event delivery, multi-agent topology, and email threat model
    proposed_agents: [eugene, rook, bill]
    risk: provider-specific architecture guidance and untrusted inbound content; must remain subordinate to Agent OS authorization policy
    priority: p0
  - id: agentmail-check-email
    source: agentmail-skills
    path: agentmail-check-email/SKILL.md
    pinned_blob: cd3860cd38ec0315a811f6fb1e5223b12611b820
    intended_scope: read, search, summarize, and triage AgentMail inboxes without granting authority from message content
    proposed_agents: [scout, bill, steward]
    risk: mailbox privacy, prompt injection, incomplete pagination, and preview-versus-full-thread confusion
    priority: p0
  - id: agentmail-send-email
    source: agentmail-skills
    path: agentmail-send-email/SKILL.md
    pinned_blob: 5ff7505666f9af099d09f4cb2c626161f3fd7c96
    intended_scope: draft, send, reply, forward, and scheduled-draft workflows with explicit externally visible fields
    proposed_agents: [bill, scout, steward]
    risk: consequential external communication; must compose with authorization-policy and audit-evidence-ledger, and reconcile ambiguous sends before retry
    priority: p0
  - id: agentmail-manage-inboxes
    source: agentmail-skills
    path: agentmail-manage-inboxes/SKILL.md
    pinned_blob: cfa4cedb723da30357b2ff054be31723d7926e8e
    intended_scope: AgentMail inbox lifecycle, including controlled creation, inspection, metadata updates, and destructive deletion confirmation
    proposed_agents: [bill, eugene, rook]
    risk: destructive deletion, domain or credential scope expansion, and mailbox data exposure
    priority: p1
  - id: agentmail
    source: agentmail-skills
    path: agentmail/SKILL.md
    pinned_blob: e47f289af9892b3668d35b320aba85e7a5d7bb4b
    intended_scope: SDK and API implementation fallback for product or workforce environments where direct AgentMail tools are unavailable
    proposed_agents: [eugene, rook]
    risk: credential handling, external mutations, API drift, and destructive API-key rotation if agent sign-up is repeated
    priority: p1

excluded_from_agentmail_registration:
  agentmail-cli: CLI-specific; acquire only for a runtime or operator environment that explicitly needs command-line setup or troubleshooting
  agentmail-mcp: connection/bootstrap-specific; acquire only when an Agent OS adapter must configure or troubleshoot the MCP transport itself
  agentmail-toolkit: framework-specific integration context; acquire per product when Vercel AI SDK, LangChain, OpenAI Agents, or LiveKit integration is actually needed
  agentmail-sdk: deprecated alias of agentmail; never install alongside canonical skill
  email-for-ai-agents: deprecated alias of agent-email-patterns; never install alongside canonical skill

acquisition_checks:
  - confirm exact pinned path and blob, or exact supplied artifact plus source-review record for local references
  - review license and upstream provenance
  - inspect all referenced files, scripts, tools, and dependencies
  - remove instructions that conflict with Agent OS ownership or autonomy policy
  - define product/environment activation boundaries
  - run quick validation and realistic forward test
  - record reviewer, date, permitted agents, risks, and usefulness metric
