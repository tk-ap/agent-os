version: 0.1.0

principles:
  agent_os_workforce: shared execution infrastructure; not a separate public offering
  authority: context and intelligence may propose work but do not grant execution authority
  evidence: implemented, simulated, preview, deployed, and user-validated states must remain distinct

products:
  alvira-meos:
    plane: context
    role: context intelligence, capture, reflection, and portability
    primary_agents: [designer, eugene, w-dog, rook]
    default_skills: [context-provenance, ecosystem-contracts, end-to-end-verification]
    constraints: [shared interview engine does not imply one mega-interview, context is not authorization]
  alvira-bridge:
    plane: context
    role: gated secondary ALVIRA capability
    primary_agents: [eugene, designer, rook]
    default_skills: [ecosystem-contracts, context-provenance, authorization-policy]
    constraints: [not a standalone public offering, unlock only under product-defined completion and account rules]
  ailhat:
    plane: intelligence
    role: host-agnostic portfolio intelligence and product signal
    primary_agents: [scout, zoie, steward, router, w-dog]
    default_skills: [competitive-intelligence, research-synthesis, task-envelope, audit-evidence-ledger]
    constraints: [signals propose work, simulated findings must be labeled, recommendations require evidence]
  agent-control:
    plane: governance
    role: authorization intelligence
    primary_agents: [rook, eugene, w-dog]
    default_skills: [authorization-policy, audit-evidence-ledger, end-to-end-verification]
    constraints: [do not absorb capacity allocation or product-state UI outside its defined scope]
  ledgato:
    plane: governance
    role: governance and enforcement concept
    primary_agents: [rook, eugene, zoie, w-dog]
    default_skills: [authorization-policy, ecosystem-contracts, end-to-end-verification]
    constraints: [production runtime and buyer proof remain unresolved, do not overclaim enforcement]
  ashwood:
    plane: evidence
    role: public creative portfolio and founder build archive
    primary_agents: [designer, scout, w-dog, steward]
    default_skills: [audit-evidence-ledger, research-synthesis, end-to-end-verification]
    constraints: [creative Portfolio and SaaS Build Journal remain distinct, public narrative is curated from evidence]

environments:
  cto-new: {adapter: adapters/cto-new, mode: generalized harness execution}
  codex: {adapter_status: planned, mode: generalized harness execution}
  github: {adapter_status: planned, mode: source control, review, and workflow evidence}
  vercel: {adapter_status: planned, mode: preview and production deployment}
  github-pages: {adapter_status: planned, mode: static production deployment}
  agentmail: {adapter_status: planned, mode: governed agent communications}
