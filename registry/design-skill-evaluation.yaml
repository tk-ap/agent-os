version: 0.1.0
status: evaluation-only

policy:
  discovery_library: open
  candidate_growth: frozen-by-default
  active_task_set: minimum-sufficient
  new_candidate_requires_one_of:
    - demonstrated-capability-gap
    - replaces-or-outperforms-existing-candidate
    - materially-different-verification-method
  directory_rank_is_trust: false
  catalog_install_allowed: false
  benchmark_before_approval: true
  zero_trust_admission_required: true

active_set_target:
  producer_skills_max: 1
  specialist_skills_max: 1
  independent_review_skills_max: 1
  note: Limits are defaults, not hard runtime caps; deviations need a concrete task reason.

shortlist:
  interface-review:
    source: jakubkrehel/skills
    pinned_commit: 267330e1adfc66a718fb65fa6918c1f06d0a689e
    path: skills/interface-review/SKILL.md
    pinned_blob: a5c47e5e94ec170f1ea2df4ab536c1034e376aa7
    license: MIT
    priority: p0
    role: read-only post-change interface inspection
    proposed_agents: [designer, w-dog, eugene]
    activation: candidate-only
  emil-design-eng:
    source: emilkowalski/skills
    pinned_commit: d23d7f88a2e21c9e4b1418c7abe420f5c1052ba7
    path: skills/emil-design-eng/SKILL.md
    license: MIT
    priority: p1
    role: conditional interaction-and-motion specialist
    proposed_agents: [designer, eugene]
    activation: candidate-only
  impeccable:
    source: pbakaus/impeccable
    pinned_commit: 0330f61cef1c88291755beb373c81bef5f15be70
    path: .agents/skills/impeccable/SKILL.md
    observed_version: 4.1.3
    license: Apache-2.0
    priority: p1
    role: reference-or-replacement candidate; never wholesale by default
    proposed_agents: [designer, w-dog]
    activation: reference-only-pending-full-package-security-review

benchmark_products:
  ashwood:
    surface: editorial-public-experience
    target_signal: art-direction fidelity without generic layout or interaction churn
  alvira:
    surface: beginner-friendly product-and-onboarding UI
    target_signal: comprehension, density reduction, interaction clarity, regression safety
  ailhat:
    surface: operational-intelligence product UI
    target_signal: scanability, action clarity, restrained motion, non-generic product specificity

promotion_rule:
  require_repeatable_gain: true
  compare_against_baseline: true
  demote_on_redundancy: true
  do_not_promote_on_single-aesthetic-win: true
  human_acceptance_required_for_taste: true

source_review: registry/source-reviews/agenticskills-design-2026-09-02.md
benchmark_plan: docs/quality/DESIGN_SKILL_BENCHMARK.md
